<svg width="350" height="240" viewBox="0 0 350 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientStrategy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="strategyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3" />
    </linearGradient>
    <filter id="strategyGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="240" fill="url(#bgGradientStrategy)"/>
  
  <!-- Strategy framework -->
  <rect x="20" y="20" width="310" height="180" rx="12" fill="rgba(0, 0, 0, 0.5)" stroke="#a855f7" stroke-width="2"/>
  
  <!-- Header -->
  <text x="175" y="40" text-anchor="middle" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI-Generated Strategy Recommendations</text>
  
  <!-- Recommendation cards -->
  <g transform="translate(30, 55)">
    <!-- Primary recommendation -->
    <rect width="280" height="35" rx="8" fill="rgba(168, 85, 247, 0.3)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="15" cy="17" r="8" fill="#10b981"/>
    <text x="15" y="21" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">1</text>
    <text x="30" y="15" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Primary: Activate Alternative Supplier Network</text>
    <text x="30" y="27" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="8">ROI: +$1.8M • Risk Reduction: 85% • Implementation: 24-48hrs</text>
    
    <!-- Priority indicator -->
    <rect x="240" y="5" width="35" height="25" rx="4" fill="#10b981" opacity="0.8"/>
    <text x="257" y="12" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">HIGH</text>
    <text x="257" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7">PRIORITY</text>
  </g>
  
  <g transform="translate(30, 95)">
    <!-- Secondary recommendation -->
    <rect width="280" height="30" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
    <circle cx="12" cy="15" r="6" fill="#f59e0b"/>
    <text x="12" y="18" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">2</text>
    <text x="25" y="12" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Reroute Logistics via Northern Corridor</text>
    <text x="25" y="23" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Cost: +$450K • Time Saved: 3-5 days • Feasibility: 92%</text>
    
    <!-- Priority indicator -->
    <rect x="240" y="8" width="30" height="15" rx="3" fill="#f59e0b" opacity="0.8"/>
    <text x="255" y="18" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="6" font-weight="bold">MEDIUM</text>
  </g>
  
  <g transform="translate(30, 130)">
    <!-- Tertiary recommendation -->
    <rect width="280" height="30" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
    <circle cx="12" cy="15" r="6" fill="#6366f1"/>
    <text x="12" y="18" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">3</text>
    <text x="25" y="12" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Increase Safety Stock for Critical Components</text>
    <text x="25" y="23" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Investment: $275K • Buffer: 15 days • Long-term ROI: +$2.1M</text>
    
    <!-- Priority indicator -->
    <rect x="240" y="8" width="30" height="15" rx="3" fill="#6366f1" opacity="0.8"/>
    <text x="255" y="18" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="6" font-weight="bold">STRATEGIC</text>
  </g>
  
  <!-- Decision matrix -->
  <g transform="translate(30, 170)">
    <text x="0" y="0" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Decision Matrix</text>
    
    <!-- Matrix headers -->
    <text x="60" y="12" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Cost</text>
    <text x="90" y="12" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Speed</text>
    <text x="120" y="12" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Risk</text>
    <text x="150" y="12" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">ROI</text>
    
    <!-- Option 1 scores -->
    <circle cx="60" cy="22" r="3" fill="#10b981"/>
    <circle cx="90" cy="22" r="3" fill="#10b981"/>
    <circle cx="120" cy="22" r="3" fill="#10b981"/>
    <circle cx="150" cy="22" r="3" fill="#10b981"/>
    
    <!-- AI confidence -->
    <text x="180" y="12" fill="#a855f7" font-family="Arial, sans-serif" font-size="8" font-weight="bold">AI Confidence: 94%</text>
    <text x="180" y="24" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Based on 1,247 similar scenarios</text>
  </g>
  
  <!-- Performance projection -->
  <g transform="translate(200, 55)">
    <!-- Mini performance chart -->
    <rect x="50" y="0" width="60" height="30" fill="rgba(168, 85, 247, 0.1)" stroke="#a855f7" stroke-width="1" rx="4"/>
    <polyline points="55,25 65,20 75,15 85,10 95,8 105,5" 
              fill="none" stroke="#10b981" stroke-width="2" filter="url(#strategyGlow)"/>
    
    <!-- Projection label -->
    <text x="80" y="40" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="7">Recovery Projection</text>
  </g>
  
  <!-- Automation indicators -->
  <g transform="translate(280, 170)">
    <circle cx="0" cy="5" r="3" fill="#a855f7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="9" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="8">Auto-executing</text>
  </g>
  
  <!-- Title -->
  <text x="175" y="220" text-anchor="middle" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Smart Mitigation Strategies</text>
</svg> 