<svg width="350" height="240" viewBox="0 0 350 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientSimDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="240" fill="url(#bgGradientSimDet)"/>
  
  <!-- Analysis dashboard -->
  <rect x="20" y="20" width="310" height="180" rx="12" fill="rgba(0, 0, 0, 0.6)" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Header -->
  <text x="175" y="40" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Monte Carlo Simulation Results</text>
  
  <!-- Risk probability chart -->
  <g transform="translate(40, 60)">
    <text x="0" y="0" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Risk Probability (%)</text>
    <!-- Chart bars -->
    <rect x="0" y="10" width="15" height="40" fill="url(#chartGradient)"/>
    <rect x="20" y="5" width="15" height="50" fill="url(#chartGradient)"/>
    <rect x="40" y="15" width="15" height="35" fill="url(#chartGradient)"/>
    <rect x="60" y="20" width="15" height="30" fill="url(#chartGradient)"/>
    <rect x="80" y="25" width="15" height="25" fill="url(#chartGradient)"/>
    
    <!-- Chart labels -->
    <text x="7" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Low</text>
    <text x="27" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Med</text>
    <text x="47" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">High</text>
    <text x="67" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Crit</text>
    <text x="87" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Ext</text>
  </g>
  
  <!-- Impact timeline -->
  <g transform="translate(150, 60)">
    <text x="0" y="0" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Impact Timeline</text>
    <!-- Timeline line -->
    <line x1="0" y1="35" x2="120" y2="35" stroke="#f59e0b" stroke-width="2"/>
    <!-- Timeline points -->
    <circle cx="20" cy="35" r="4" fill="#ef4444"/>
    <circle cx="50" cy="35" r="4" fill="#f59e0b"/>
    <circle cx="80" cy="35" r="4" fill="#fbbf24"/>
    <circle cx="110" cy="35" r="4" fill="#10b981"/>
    
    <!-- Timeline labels -->
    <text x="20" y="50" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Day 1</text>
    <text x="50" y="50" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Day 3</text>
    <text x="80" y="50" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Day 7</text>
    <text x="110" y="50" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Day 14</text>
    
    <!-- Impact values -->
    <text x="20" y="25" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="7">85%</text>
    <text x="50" y="25" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="7">60%</text>
    <text x="80" y="25" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="7">35%</text>
    <text x="110" y="25" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="7">15%</text>
  </g>
  
  <!-- Scenario details -->
  <g transform="translate(40, 130)">
    <text x="0" y="0" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Scenario: Category 4 Hurricane</text>
    <text x="0" y="15" fill="#ef4444" font-family="Arial, sans-serif" font-size="8">● Manufacturing: 3 facilities offline (Miami, Houston, Mobile)</text>
    <text x="0" y="27" fill="#f59e0b" font-family="Arial, sans-serif" font-size="8">● Logistics: 2 major ports closed, 5 routes disrupted</text>
    <text x="0" y="39" fill="#fbbf24" font-family="Arial, sans-serif" font-size="8">● Suppliers: 12 tier-1 suppliers affected, 45 tier-2 impacted</text>
    <text x="0" y="51" fill="#10b981" font-family="Arial, sans-serif" font-size="8">● Recovery: Alternative routes activated, backup suppliers engaged</text>
  </g>
  
  <!-- Cost impact -->
  <g transform="translate(280, 60)">
    <rect width="50" height="80" rx="6" fill="rgba(239, 68, 68, 0.3)" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="15" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Cost Impact</text>
    <text x="25" y="30" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="bold">$2.4M</text>
    <text x="25" y="45" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="7">Direct: $1.6M</text>
    <text x="25" y="55" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="7">Indirect: $0.8M</text>
    <text x="25" y="70" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="7">Confidence: 87%</text>
  </g>
  
  <!-- Title -->
  <text x="175" y="220" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Advanced Scenario Analysis</text>
</svg> 